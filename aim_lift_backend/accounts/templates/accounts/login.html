{% extends "base.html" %}
{% block title %}Login - AIM-Lift{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-200">

  <!-- Login Card -->
  <div class="w-full max-w-md p-10 bg-white shadow-xl rounded-2xl">
    <h2 class="text-3xl font-extrabold text-gray-800 mb-8 text-center tracking-tight">Login</h2>

    <form method="post" action="" class="space-y-6">
      {% csrf_token %}

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-600 mb-1">Username</label>
        <input type="text" name="username" id="username" required
               class="w-full border-b-2 border-gray-300 focus:border-indigo-600 focus:outline-none py-2 px-1 text-gray-800 placeholder-gray-400"
               placeholder="Enter your username">
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-600 mb-1">Password</label>
        <input type="password" name="password" id="password" required
               class="w-full border-b-2 border-gray-300 focus:border-indigo-600 focus:outline-none py-2 px-1 text-gray-800 placeholder-gray-400"
               placeholder="Enter your password">
      </div>

      <!-- Login Button -->
      <button type="submit"
              class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition duration-300 shadow-md">
        Login
      </button>
    </form>

    <!-- Optional Links -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Forgot your password?
      <a href="{% url 'password_reset' %}" class="text-indigo-600 font-medium hover:underline">
        Reset here
      </a>
    </p>
  </div>
</div>
{% endblock %}
