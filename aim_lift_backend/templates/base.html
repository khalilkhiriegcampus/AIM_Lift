{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AIM-Lift{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-indigo-700 text-white px-6 py-4 flex justify-between items-center shadow">
    <div class="text-xl font-bold">AIM-Lift</div>
    <div>
      <a href="{% url 'dashboard' %}" class="px-4 hover:underline">Dashboard</a>
      <a href="{% url 'complaints' %}" class="px-4 hover:underline">Complaints</a>
      <a href="{% url 'login' %}" class="px-4 hover:underline">Login</a>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="p-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
