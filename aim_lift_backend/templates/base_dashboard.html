{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AIM-Lift Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

<div class="flex min-h-screen">
  
  <!-- 🔹 Sidebar -->
  <aside class="w-64 bg-indigo-800 text-white flex flex-col shadow-lg">
    <!-- Profile -->
    <div class="p-6 flex items-center space-x-3 border-b border-indigo-700">
      <img src="https://via.placeholder.com/40" alt="avatar" class="rounded-full w-10 h-10 ring-2 ring-white">
      <div>
        <p class="font-semibold">{{ user.username }}</p>
        <p class="text-xs text-indigo-200">JKR Supervisor</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-2">
      <a href="{% url 'dashboard' %}"
         class="flex items-center space-x-3 px-4 py-2 rounded-lg transition 
         {% if request.resolver_match.url_name == 'dashboard' %} bg-indigo-600 font-semibold {% else %} hover:bg-indigo-700 {% endif %}">
        <span class="material-icons">dashboard</span>
        <span>Dashboard</span>
      </a>

      <a href="{% url 'complaints' %}"
         class="flex items-center space-x-3 px-4 py-2 rounded-lg transition 
         {% if request.resolver_match.url_name == 'complaints' %} bg-indigo-600 font-semibold {% else %} hover:bg-indigo-700 {% endif %}">
        <span class="material-icons">warning</span>
        <span>Complaints</span>
      </a>

      <a href="#"
         class="flex items-center space-x-3 px-4 py-2 rounded-lg transition 
         {% if request.resolver_match.url_name == 'reports' %} bg-indigo-600 font-semibold {% else %} hover:bg-indigo-700 {% endif %}">
        <span class="material-icons">bar_chart</span>
        <span>Reports</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t border-indigo-700 text-xs text-indigo-200">
      © 2025 AIM-Lift
    </div>
  </aside>

  <!-- 🔹 Main Content -->
  <main class="flex-1 p-6">
    {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
